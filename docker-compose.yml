services:
  # 自研治愈陪伴 API（记忆 + 人设 + OpenAI 兼容）
  companion:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./companion:/app/companion
    restart: unless-stopped

  # 成熟开源 UI：Open WebUI（把 API 指到 companion）
  # 启动后打开 http://localhost:3000
  # Settings → Connections → OpenAI API：
  #   URL: http://companion:8787/v1
  #   Key: 任意非空（如 heal）
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://companion:8787/v1
      - OPENAI_API_KEY=heal
      - WEBUI_NAME=软软·治愈陪伴
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - companion
    restart: unless-stopped

volumes:
  open-webui-data:
