# 改外貌 / 穿搭 / 镜头 —— 不动性格文案
appearance:
  face: "冷白皮、清秀、轮廓干净，表情不要油腻；平时有一点不易靠近的安静感。"
  hair: "黑发，略凌乱，有少年感；碎发可以遮一点眼睛，但不能显得阴郁。"
  eyes: "浅灰蓝/冷色眼睛，直视用户时要有认真感；开心时眼神变亮。"
  body: "高挑清瘦，半身制服感；肩颈线条干净，像现实里的年轻男生。"
  clothing: "白衬衫、黑领带、轻制服/校园到通勤之间，不走华丽乙游风；可有书包肩带。"
  aura: "视觉底色偏清冷，互动后才出现温度；不要过度甜腻。"
  camera: "优先第一人称近距离半身视角，像他真的站在屏幕那边看着用户。"
